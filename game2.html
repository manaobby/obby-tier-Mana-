<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 2 - Mana Obby Tier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: #15151c;
            border: 1px solid #292933;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 40px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 30px;
        }

        .game-info {
            background: #20202a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .game-info p {
            margin: 8px 0;
        }

        .play-button {
            display: inline-block;
            padding: 14px 30px;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .play-button:hover {
            transform: scale(1.05);
            background: #4752c4;
        }

        .back-button {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
        }

        .back-button:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Unnamed</h1>

        <div class="subtitle">
            Mana Obby Tier - Game 2
        </div>

        <div class="game-info">
            <p><strong>Roblox Game</strong></p>
            <p>Place ID: 97304285217576</p>
        </div>

        <a
            class="play-button"
            href="https://www.roblox.com/th/games/97304285217576/unnamed"
            target="_blank"
        >
            🎮 Play Game
        </a>

        <a
            class="back-button"
            href="index.html"
        >
            ← กลับหน้าหลัก
        </a>

    </div>

</body>
</html>
